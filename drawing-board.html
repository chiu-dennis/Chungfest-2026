<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chungfest 2026 - Drawing Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #1e3a5f;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 16px;
  }
  #timer {
    text-align: center;
    font-size: 13vh;
    font-weight: 900;
    color: white;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  #timer.warning { color: #ffb400; }
  #timer.danger { color: #ff4d4d; }
  #colorRow {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .colorBtn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.3);
    cursor: pointer;
    flex-shrink: 0;
  }
  .colorBtn.active {
    border-color: white;
    transform: scale(1.15);
  }
  #sizeRow {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-shrink: 0;
    align-items: center;
  }
  .sizeBtn {
    flex: 0 0 44px;
    height: 44px;
    border-radius: 10px;
    border: 3px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sizeBtn.active {
    border-color: white;
    background: rgba(255,255,255,0.3);
  }
  .sizeDot {
    background: white;
    border-radius: 50%;
  }
  #toolRow {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }
  .toolBtn {
    flex: 0 0 68px;
    height: 44px;
    border-radius: 10px;
    border: 3px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .toolBtn.active {
    border-color: white;
    background: rgba(255,255,255,0.35);
  }
  #canvasWrap {
    flex: 1;
    min-height: 0;
    display: flex;
  }
  #drawCanvas {
    flex: 1;
    width: 100%;
    height: 100%;
    background: white;
    border-radius: 16px;
    touch-action: none;
    display: block;
  }
  #controls {
    display: flex;
    gap: 12px;
    margin-top: 12px;
    flex-shrink: 0;
  }
  button {
    flex: 1;
    font-size: 22px;
    font-weight: 800;
    padding: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
  }
  #startBtn { background: #2e7d32; color: white; }
  #startBtn:disabled { background: #999; }
  #clearBtn { background: #999; color: white; flex: 0 0 130px; }
  #undoBtn { background: #1e88e5; color: white; flex: 0 0 130px; }
  #undoBtn:disabled { background: #ccc; }
  #resetTimerBtn { background: #d62828; color: white; flex: 0 0 130px; }
</style>
</head>
<body>
  <div id="timer">120</div>
  <div id="toolRow"></div>
  <div id="colorRow"></div>
  <div id="sizeRow"></div>
  <div id="canvasWrap">
    <canvas id="drawCanvas"></canvas>
  </div>
  <div id="controls">
    <button id="startBtn" onclick="startTimer()">START 120s TIMER</button>
    <button id="clearBtn" onclick="clearCanvas()">CLEAR</button>
    <button id="undoBtn" onclick="undoLast()" disabled>UNDO</button>
    <button id="resetTimerBtn" onclick="resetTimer()">RESET</button>
  </div>

<script>
const canvas = document.getElementById('drawCanvas');
const ctx = canvas.getContext('2d');
let drawing = false;
let lastX = 0, lastY = 0;

let currentTool = 'pen'; // 'pen' | 'eraser' | 'fill'
let undoStack = [];
const UNDO_LIMIT = 20;

function pushUndo() {
  try {
    undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    document.getElementById('undoBtn').disabled = false;
  } catch (e) { /* canvas not ready yet */ }
}

function undoLast() {
  if (undoStack.length === 0) return;
  const imgData = undoStack.pop();
  ctx.putImageData(imgData, 0, 0);
  if (undoStack.length === 0) document.getElementById('undoBtn').disabled = true;
}

function buildToolRow() {
  const row = document.getElementById('toolRow');
  const tools = [
    { id: 'pen', icon: '✏️' },
    { id: 'eraser', icon: '🧽' },
    { id: 'fill', icon: '🪣' }
  ];
  tools.forEach((t, i) => {
    const btn = document.createElement('button');
    btn.className = 'toolBtn' + (i === 0 ? ' active' : '');
    btn.textContent = t.icon;
    btn.onclick = () => selectTool(t.id, btn);
    row.appendChild(btn);
  });
}

function selectTool(id, btn) {
  currentTool = id;
  document.querySelectorAll('.toolBtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

buildToolRow();

const COLORS = ['#1a1a1a', '#d62828', '#1e88e5', '#2e7d32', '#f39c12', '#8e44ad', '#e91e63', '#00897b'];
let currentColor = COLORS[0];

function buildColorRow() {
  const row = document.getElementById('colorRow');
  COLORS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'colorBtn' + (i === 0 ? ' active' : '');
    btn.style.background = c;
    btn.style.padding = '0';
    btn.style.flex = '0 0 44px';
    btn.onclick = () => selectColor(c, btn);
    row.appendChild(btn);
  });
}

function selectColor(c, btn) {
  currentColor = c;
  ctx.strokeStyle = c;
  document.querySelectorAll('.colorBtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

buildColorRow();

const SIZES = [3, 6, 10, 18];
let currentSize = SIZES[1];

function buildSizeRow() {
  const row = document.getElementById('sizeRow');
  SIZES.forEach((s, i) => {
    const btn = document.createElement('button');
    btn.className = 'sizeBtn' + (i === 1 ? ' active' : '');
    const dot = document.createElement('div');
    dot.className = 'sizeDot';
    dot.style.width = Math.min(s + 6, 28) + 'px';
    dot.style.height = Math.min(s + 6, 28) + 'px';
    btn.appendChild(dot);
    btn.onclick = () => selectSize(s, btn);
    row.appendChild(btn);
  });
}

function selectSize(s, btn) {
  currentSize = s;
  ctx.lineWidth = s;
  document.querySelectorAll('.sizeBtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

buildSizeRow();

function resizeCanvas() {
  const rect = canvas.getBoundingClientRect();
  const imgData = (canvas.width > 0 && canvas.height > 0) ? ctx.getImageData(0, 0, canvas.width, canvas.height) : null;
  canvas.width = rect.width;
  canvas.height = rect.height;
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.lineWidth = currentSize;
  ctx.strokeStyle = currentColor;
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (imgData) ctx.putImageData(imgData, 0, 0);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const clientY = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: clientX - rect.left, y: clientY - rect.top };
}

function hexToRgb(hex) {
  const v = parseInt(hex.slice(1), 16);
  return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
}

function colorsMatch(a, b, tolerance) {
  return Math.abs(a[0] - b[0]) <= tolerance &&
         Math.abs(a[1] - b[1]) <= tolerance &&
         Math.abs(a[2] - b[2]) <= tolerance &&
         Math.abs(a[3] - b[3]) <= tolerance;
}

function floodFillAt(x, y) {
  x = Math.floor(x); y = Math.floor(y);
  const w = canvas.width, h = canvas.height;
  if (x < 0 || y < 0 || x >= w || y >= h) return;

  const imageData = ctx.getImageData(0, 0, w, h);
  const data = imageData.data;
  const startPos = (y * w + x) * 4;
  const startColor = [data[startPos], data[startPos + 1], data[startPos + 2], data[startPos + 3]];
  const fillRgb = hexToRgb(currentColor);
  const fillColor = [fillRgb.r, fillRgb.g, fillRgb.b, 255];

  if (colorsMatch(startColor, fillColor, 10)) return; // already filled with this color

  const tolerance = 60;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= w || cy >= h) continue;
    const pos = (cy * w + cx) * 4;
    if (!colorsMatch([data[pos], data[pos + 1], data[pos + 2], data[pos + 3]], startColor, tolerance)) continue;
    data[pos] = fillColor[0];
    data[pos + 1] = fillColor[1];
    data[pos + 2] = fillColor[2];
    data[pos + 3] = 255;
    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
  ctx.putImageData(imageData, 0, 0);
}

function startDraw(e) {
  const pos = getPos(e);
  if (currentTool === 'fill') {
    pushUndo();
    floodFillAt(pos.x, pos.y);
    return;
  }
  pushUndo();
  drawing = true;
  lastX = pos.x; lastY = pos.y;
}

function moveDraw(e) {
  if (!drawing) return;
  if (currentTool === 'fill') return;
  e.preventDefault();
  const pos = getPos(e);
  ctx.beginPath();
  ctx.moveTo(lastX, lastY);
  ctx.lineTo(pos.x, pos.y);
  if (currentTool === 'eraser') {
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = Math.max(currentSize * 3, 24);
  } else {
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = currentSize;
  }
  ctx.stroke();
  lastX = pos.x; lastY = pos.y;
}

function endDraw() { drawing = false; }

canvas.addEventListener('mousedown', startDraw);
canvas.addEventListener('mousemove', moveDraw);
canvas.addEventListener('mouseup', endDraw);
canvas.addEventListener('mouseleave', endDraw);
canvas.addEventListener('touchstart', startDraw);
canvas.addEventListener('touchmove', moveDraw);
canvas.addEventListener('touchend', endDraw);

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function clearCanvas() {
  pushUndo();
  ctx.fillStyle = 'white';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

// --- Timer ---
let timeLeft = 120;
let timerInterval = null;
const timerEl = document.getElementById('timer');
const startBtn = document.getElementById('startBtn');

function renderTimer() {
  timerEl.textContent = timeLeft;
  timerEl.className = '';
  if (timeLeft <= 10) timerEl.classList.add('danger');
  else if (timeLeft <= 20) timerEl.classList.add('warning');
}

function startTimer() {
  if (timerInterval) return;
  startBtn.disabled = true;
  timerInterval = setInterval(() => {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }, 1000);
}

function resetTimer() {
  clearInterval(timerInterval);
  timerInterval = null;
  timeLeft = 120;
  startBtn.disabled = false;
  renderTimer();
  clearCanvas();
}

renderTimer();
</script>
</body>
</html>
