<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chungfest 2026 Anime Trivia</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #1e3a5f;
    margin: 0;
    padding: 16px;
    color: #1a1a1a;
  }
  .card {
    max-width: 480px;
    margin: 0 auto;
    background: white;
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px 0;
    color: #1e3a5f;
  }
  .sub {
    font-size: 14px;
    color: #666;
    margin-bottom: 20px;
  }
  #timer {
    font-size: 36px;
    font-weight: 700;
    text-align: center;
    color: #1e3a5f;
    font-variant-numeric: tabular-nums;
    margin: 6px 0 16px 0;
  }
  #progress {
    text-align: center;
    font-size: 13px;
    color: #999;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .qtext {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 20px;
    margin-bottom: 10px;
    color: white;
  }
  .badge.op { background: #c0392b; }
  .badge.ds { background: #6a3fa0; }
  .badge.jjk { background: #1a237e; }
  .badge.pkmn { background: #f1c40f; color: #1a1a1a; }
  .choice {
    display: block;
    width: 100%;
    text-align: left;
    font-size: 16px;
    padding: 14px;
    margin-bottom: 10px;
    border: 2px solid #ddd;
    border-radius: 10px;
    background: white;
    cursor: pointer;
  }
  .choice:active { background: #f0f0f0; }
  .choice.selected { border-color: #1e3a5f; background: #e8f0fe; }
  .choice.correct { border-color: #2e7d32; background: #e6f4ea; }
  .choice.incorrect { border-color: #d62828; background: #fdecea; }
  button.nav {
    width: 100%;
    font-size: 18px;
    font-weight: 700;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #d62828;
    color: white;
    margin-top: 8px;
    cursor: pointer;
  }
  button.nav:active { background: #a81e1e; }
  button.nav:disabled { background: #ccc; }
  #startScreen, #resultScreen { text-align: center; }
  #nameInput {
    width: 100%;
    font-size: 18px;
    padding: 10px;
    border: 2px solid #ccc;
    border-radius: 8px;
    margin-bottom: 16px;
    text-align: center;
  }
  #resultScreen .bigscore {
    font-size: 44px;
    font-weight: 800;
    color: #1e3a5f;
    margin: 6px 0 16px 0;
  }
  .hidden { display: none; }
  .series-list {
    font-size: 14px;
    color: #444;
    margin-bottom: 16px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="card">

  <div id="startScreen">
    <h1>🏴‍☠️ Chungfest 2026</h1>
    <div class="sub" style="margin-bottom:16px;">Anime Trivia Showdown</div>
    <div class="series-list">
      20 questions covering<br>
      <strong>One Piece</strong> · <strong>Demon Slayer</strong> · <strong>Jujutsu Kaisen</strong> · <strong>Pokemon</strong><br>
      Mostly easy, with a few tough ones mixed in.<br>
      Same questions for everyone — even playing field.
    </div>
    <input type="text" id="nameInput" placeholder="Enter your name">
    <button class="nav" onclick="startTest()">START TRIVIA</button>
  </div>

  <div id="testScreen" class="hidden">
    <div id="timer">0.0s</div>
    <div id="progress"></div>
    <div id="questionArea"></div>
    <button class="nav" id="nextBtn" onclick="nextQuestion()" disabled>NEXT</button>
  </div>

  <div id="resultScreen" class="hidden">
    <h1 id="resultName">Nice work!</h1>
    <div class="sub">Final Time</div>
    <div class="bigscore" id="finalTime" style="font-size:28px;">0.0s</div>
    <div class="sub">Score</div>
    <div class="bigscore" id="finalScore">0 / 15</div>
    <button class="nav" onclick="location.reload()">RUN NEXT PERSON</button>
  </div>

</div>

<script>
// Fixed question set - identical for every competitor, so it's an even playing field.
const QUESTIONS = [
  { series: "op", label: "ONE PIECE", q: "What is the name of Luffy's pirate crew?", choices: ["Straw Hat Pirates", "Red Hair Pirates", "Heart Pirates", "Whitebeard Pirates"], correct: 0 },
  { series: "op", label: "ONE PIECE", q: "What is the name of the treasure everyone is searching for?", choices: ["The Void Century", "One Piece", "The Road Poneglyph", "The Ancient Weapon"], correct: 1 },
  { series: "op", label: "ONE PIECE", q: "What did Luffy eat to gain his powers?", choices: ["Gomu Gomu no Mi (Gum-Gum Fruit)", "Mera Mera no Mi (Flame Fruit)", "Hito Hito no Mi (Human-Human Fruit)", "Yami Yami no Mi (Dark-Dark Fruit)"], correct: 0 },
  { series: "op", label: "ONE PIECE", q: "What is the name of Luffy's ship?", choices: ["Going Merry", "Moby Dick", "Thousand Sunny", "Red Force"], correct: 2 },
  { series: "op", label: "ONE PIECE — TOUGH", q: "What is the true identity of the Straw Hats' shipwright Franky's inspiration/mentor?", choices: ["Tom", "Iceburg", "Kalifa", "Zunesha"], correct: 0 },
  { series: "ds", label: "DEMON SLAYER", q: "What is the name of the main character?", choices: ["Zenitsu Agatsuma", "Inosuke Hashibira", "Tanjiro Kamado", "Giyu Tomioka"], correct: 2 },
  { series: "ds", label: "DEMON SLAYER", q: "What happened to Tanjiro's sister Nezuko?", choices: ["She became a demon", "She lost her memory", "She became a Hashira", "She disappeared"], correct: 0 },
  { series: "ds", label: "DEMON SLAYER", q: "What organization does Tanjiro join to fight demons?", choices: ["The Demon Slayer Corps", "The Hunter Association", "The Shinsengumi", "The Order of Light"], correct: 0 },
  { series: "ds", label: "DEMON SLAYER", q: "What is the highest rank of demon slayer called?", choices: ["Kage", "Hashira", "Sage", "Captain"], correct: 1 },
  { series: "ds", label: "DEMON SLAYER — TOUGH", q: "What is the name of the demon who is the very first and most powerful, the origin of all demons?", choices: ["Akaza", "Doma", "Muzan Kibutsuji", "Kokushibo"], correct: 2 },
  { series: "jjk", label: "JUJUTSU KAISEN", q: "What does Yuji Itadori swallow at the start of the series?", choices: ["A cursed sword", "Sukuna's finger", "A demon's heart", "A cursed doll"], correct: 1 },
  { series: "jjk", label: "JUJUTSU KAISEN", q: "What school does Yuji attend to become a jujutsu sorcerer?", choices: ["Kyoto Jujutsu High", "Tokyo Jujutsu High", "Shibuya Academy", "Zenin Academy"], correct: 1 },
  { series: "jjk", label: "JUJUTSU KAISEN", q: "Who is Yuji's white-haired, extremely powerful teacher?", choices: ["Satoru Gojo", "Suguru Geto", "Kento Nanami", "Toji Fushiguro"], correct: 0 },
  { series: "jjk", label: "JUJUTSU KAISEN", q: "What are the monsters born from human negativity called?", choices: ["Titans", "Curses", "Hollows", "Demons"], correct: 1 },
  { series: "jjk", label: "JUJUTSU KAISEN — TOUGH", q: "What is the name of Satoru Gojo's signature technique that manipulates space?", choices: ["Domain Expansion: Malevolent Shrine", "Limitless", "Ten Shadows Technique", "Idle Transfiguration"], correct: 1 },
  { series: "pkmn", label: "POKEMON", q: "What is the name of the main character in the original Pokemon anime?", choices: ["Gary", "Brock", "Ash Ketchum", "Misty"], correct: 2 },
  { series: "pkmn", label: "POKEMON", q: "What type of Pokemon is Pikachu?", choices: ["Fire", "Electric", "Water", "Grass"], correct: 1 },
  { series: "pkmn", label: "POKEMON", q: "What do you use to catch wild Pokemon?", choices: ["A net", "A Poke Ball", "A cage", "A rope"], correct: 1 },
  { series: "pkmn", label: "POKEMON", q: "What is the name of the professor who gives Ash his first Pokemon?", choices: ["Professor Elm", "Professor Birch", "Professor Oak", "Professor Sycamore"], correct: 2 },
  { series: "pkmn", label: "POKEMON — TOUGH", q: "What is Charizard's final evolution stage number, and what does Charmander evolve into first?", choices: ["Charmeleon, then Charizard", "Charizard, then Charmeleon", "Charla, then Charizard", "Charmander evolves directly into Charizard"], correct: 0 }
];

let currentIndex = 0;
let answers = [];
let startTime, timerInterval;

function startTest() {
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('testScreen').classList.remove('hidden');
  currentIndex = 0;
  answers = new Array(QUESTIONS.length).fill(null);

  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - startTime) / 1000;
    document.getElementById('timer').textContent = elapsed.toFixed(1) + 's';
  }, 100);

  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentIndex];
  document.getElementById('progress').textContent = `Question ${currentIndex + 1} of ${QUESTIONS.length}`;
  document.getElementById('nextBtn').disabled = true;
  document.getElementById('nextBtn').textContent = currentIndex === QUESTIONS.length - 1 ? 'FINISH' : 'NEXT';

  const area = document.getElementById('questionArea');
  const badgeClass = q.series;
  let html = `<div class="badge ${badgeClass}">${q.label}</div>`;
  html += `<div class="qtext">${q.q}</div>`;
  q.choices.forEach((c, i) => {
    html += `<button class="choice" id="choice${i}" onclick="selectChoice(${i})">${c}</button>`;
  });
  area.innerHTML = html;
}

function selectChoice(i) {
  if (answers[currentIndex] !== null) return; // already answered
  answers[currentIndex] = i;
  const q = QUESTIONS[currentIndex];
  for (let j = 0; j < q.choices.length; j++) {
    const btn = document.getElementById('choice' + j);
    btn.style.pointerEvents = 'none';
    if (j === q.correct) btn.classList.add('correct');
    else if (j === i) btn.classList.add('incorrect');
  }
  document.getElementById('nextBtn').disabled = false;
}

function nextQuestion() {
  if (currentIndex < QUESTIONS.length - 1) {
    currentIndex++;
    renderQuestion();
  } else {
    finishTest();
  }
}

function finishTest() {
  clearInterval(timerInterval);
  const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
  let correct = 0;
  QUESTIONS.forEach((q, i) => {
    if (answers[i] === q.correct) correct++;
  });

  const name = document.getElementById('nameInput').value.trim() || 'Player';
  document.getElementById('testScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('resultName').textContent = name + "'s Results";
  document.getElementById('finalTime').textContent = elapsed + 's';
  document.getElementById('finalScore').textContent = correct + ' / ' + QUESTIONS.length;
}
</script>
</body>
</html>
